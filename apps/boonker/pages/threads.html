<template>
  <div class="page page-threads">
    <div class="navbar">
      <div class="navbar-bg"></div>
      <div class="navbar-inner sliding">
        <div class="left">
          <a href="#" class="link back">
            <i class="icon icon-back"></i>
            <span class="if-not-md">Back</span>
          </a>
        </div>
        <div class="title">Threads Studio</div>
        <div class="right">
          ${serverOnline ? $h`
            <span class="badge color-green margin-right-half">Online</span>
            <a href="#" class="link icon-only" onClick=${reloadFrame} title="Reload Canvas">
              <i class="icon t4-icons">arrow_clockwise</i>
            </a>
            <a href=${serverUrl} target="_blank" class="link icon-only external" title="Open in New Tab">
              <i class="icon t4-icons">arrow_up_right</i>
            </a>
          ` : $h`
            <span class="badge color-red margin-right-half">Offline</span>
            <a href="#" class="link icon-only" onClick=${checkServer} title="Retry Connection">
              <i class="icon t4-icons">arrow_clockwise</i>
            </a>
          `}
        </div>
      </div>
    </div>
    <div class="page-content threads-content">
      ${serverOnline ? $h`
        <div class="threads-iframe-container">
          <iframe id="threads-studio-frame" src=${serverUrl} frameborder="0" allow="fullscreen"></iframe>
        </div>
      ` : $h`
        <div class="block block-strong-inset text-align-center threads-offline-banner">
          <i class="icon t4-icons color-gray" style="font-size: 64px; margin-bottom: 16px;">arrow_branch</i>
          <h2>Threads Studio Offline</h2>
          <p class="text-color-gray">
            The server-category packages (<code>techno4-threads</code> &amp; <code>techno4-total</code>) are currently not running.
          </p>
          <div class="card card-outline margin-top margin-bottom text-align-left" style="background: rgba(0,0,0,0.03);">
            <div class="card-content card-content-padding font-monospace">
              <div># Start with full server stack:</div>
              <div class="text-color-blue font-bold">npm run dev</div>
              <div class="margin-top-half"># Or enable explicitly:</div>
              <div class="text-color-blue font-bold">npm run dev:all</div>
            </div>
          </div>
          <p>
            <button class="button button-fill button-round display-inline-block" onClick=${checkServer}>
              <i class="icon t4-icons" style="font-size: 18px; vertical-align: middle; margin-right: 4px;">arrow_clockwise</i>
              Check Server Status
            </button>
          </p>
        </div>
      `}
    </div>
  </div>
</template>
<style>
  .threads-content {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 0 !important;
    overflow: hidden !important;
  }
  .threads-iframe-container {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
    background: #1e1e1e;
  }
  .threads-iframe-container iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
  }
  .threads-offline-banner {
    max-width: 520px;
    margin: 48px auto !important;
    padding: 32px 24px;
    border-radius: 16px;
  }
  .margin-right-half {
    margin-right: 8px;
  }
  .margin-top-half {
    margin-top: 8px;
  }
</style>
<script>
  export default (props, { $, $t4, $on, $update }) => {
    let serverOnline = false;
    let serverUrl = 'http://localhost:8000';

    const checkServer = async () => {
      try {
        const res = await fetch('/api/threads/status');
        if (res.ok) {
          const data = await res.json();
          serverOnline = !!data.online;
          if (data.url) serverUrl = data.url;
        } else {
          serverOnline = false;
        }
      } catch (e) {
        serverOnline = false;
      }
      $update();
    };

    const reloadFrame = (e) => {
      e.preventDefault();
      const iframe = document.getElementById('threads-studio-frame');
      if (iframe) {
        iframe.src = iframe.src;
      }
    };

    $on('pageInit', () => {
      checkServer();
    });

    return $render;
  };
</script>
