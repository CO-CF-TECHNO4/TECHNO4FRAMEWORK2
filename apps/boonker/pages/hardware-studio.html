    let audioCtx = null;
    let masterGain = null;
    let analyser = null;
    let audioRunning = false;
    let sampleRate = 48000;
    let waveform = 'sawtooth';
    let volume = 70;
    let animFrameId = null;
    let activeVoiceCount = 0;
    let isDemoPlaying = false;
    let demoTimerId = null;

    const activeVoices = new Map(); // noteName -> { osc, gain }
    const activeKeys = {}; // noteName -> boolean

    const whiteKeys = [
      { note: 'C4', freq: 261.63, keyChar: 'A' },
      { note: 'D4', freq: 293.66, keyChar: 'S' },
      { note: 'E4', freq: 329.63, keyChar: 'D' },
      { note: 'F4', freq: 349.23, keyChar: 'F' },
      { note: 'G4', freq: 392.00, keyChar: 'G' },
      { note: 'A4', freq: 440.00, keyChar: 'H' },
      { note: 'B4', freq: 493.88, keyChar: 'J' },
      { note: 'C5', freq: 523.25, keyChar: 'K' },
    ];

    const blackKeys = [
      { note: 'C#4', freq: 277.18, left: '8.5%', keyChar: 'W' },
      { note: 'D#4', freq: 311.13, left: '21.0%', keyChar: 'E' },
      { note: 'F#4', freq: 369.99, left: '46.0%', keyChar: 'T' },
      { note: 'G#4', freq: 415.30, left: '58.5%', keyChar: 'Y' },
      { note: 'A#4', freq: 466.16, left: '71.0%', keyChar: 'U' },
    ];

    const keyCharMap = {
      KeyA: { note: 'C4', freq: 261.63 },
      KeyW: { note: 'C#4', freq: 277.18 },
      KeyS: { note: 'D4', freq: 293.66 },
      KeyE: { note: 'D#4', freq: 311.13 },
      KeyD: { note: 'E4', freq: 329.63 },
      KeyF: { note: 'F4', freq: 349.23 },
      KeyT: { note: 'F#4', freq: 369.99 },
      KeyG: { note: 'G4', freq: 392.00 },
      KeyY: { note: 'G#4', freq: 415.30 },
      KeyH: { note: 'A4', freq: 440.00 },
      KeyU: { note: 'A#4', freq: 466.16 },
      KeyJ: { note: 'B4', freq: 493.88 },
      KeyK: { note: 'C5', freq: 523.25 },
    };

    function initAudioContext() {
      if (audioCtx) return audioCtx;
      if (typeof window === 'undefined') return null;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      try {
        audioCtx = new AudioContextClass();
        sampleRate = audioCtx.sampleRate || 48000;
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(volume / 100, audioCtx.currentTime);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);

        audioRunning = audioCtx.state === 'running';
        startOscilloscope();
      } catch (err) {
        console.error('AudioContext init error:', err);
      }
      return audioCtx;
    }

    function ensureAudioRunning() {
      const ctx = initAudioContext();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().then(() => {
          audioRunning = true;
          $update();
        });
      } else if (ctx && ctx.state === 'running') {
        audioRunning = true;
      }
      return ctx;
    }

    function playNote(noteName, freq) {
      const ctx = ensureAudioRunning();
      if (!ctx || !masterGain) return;

      if (activeVoices.has(noteName)) {
        stopNote(noteName);
      }

      try {
        const osc = ctx.createOscillator();
        const voiceGain = ctx.createGain();

        osc.type = waveform;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        // Envelope: 12ms attack
        voiceGain.gain.setValueAtTime(0.0001, ctx.currentTime);
        voiceGain.gain.linearRampToValueAtTime(0.7, ctx.currentTime + 0.012);

        osc.connect(voiceGain);
        voiceGain.connect(masterGain);
        osc.start();

        activeVoices.set(noteName, { osc, gain: voiceGain });
        activeKeys[noteName] = true;
        activeVoiceCount = activeVoices.size;
        $update();
      } catch (err) {
        console.error('playNote error:', err);
      }
    }

    function stopNote(noteName) {
      if (!activeVoices.has(noteName)) return;
      const voice = activeVoices.get(noteName);
      activeVoices.delete(noteName);
      delete activeKeys[noteName];
      activeVoiceCount = activeVoices.size;

      if (audioCtx && voice && voice.gain) {
        try {
          const now = audioCtx.currentTime;
          voice.gain.gain.cancelScheduledValues(now);
          voice.gain.gain.setValueAtTime(voice.gain.gain.value, now);
          voice.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
          setTimeout(() => {
            try {
              voice.osc.stop();
              voice.osc.disconnect();
              voice.gain.disconnect();
            } catch (e) {}
          }, 110);
        } catch (e) {}
      }
      $update();
    }

    function stopAllVoices() {
      if (demoTimerId) {
        clearInterval(demoTimerId);
        demoTimerId = null;
        isDemoPlaying = false;
      }
      activeVoices.forEach((voice, name) => {
        try {
          voice.osc.stop();
          voice.osc.disconnect();
          voice.gain.disconnect();
        } catch (e) {}
      });
      activeVoices.clear();
      Object.keys(activeKeys).forEach((k) => delete activeKeys[k]);
      activeVoiceCount = 0;
      $update();
    }

    function onKeyPointerDown(e, note, freq) {
      if (e) e.preventDefault();
      playNote(note, freq);
    }

    function onKeyPointerUp(e, note) {
      if (e) e.preventDefault();
      stopNote(note);
    }

    function onKeyPointerLeave(e, note) {
      stopNote(note);
    }

    function setWaveform(w) {
      waveform = w;
      activeVoices.forEach((voice) => {
        try {
          voice.osc.type = w;
        } catch (e) {}
      });
      $update();
    }

    function handleVolumeChange(e) {
      volume = parseInt(e.target.value, 10) || 0;
      if (masterGain && audioCtx) {
        masterGain.gain.setTargetAtTime(volume / 100, audioCtx.currentTime, 0.02);
      }
      $update();
    }

    function playDemoMelody() {
      if (isDemoPlaying) {
        stopAllVoices();
        return;
      }
      ensureAudioRunning();
      isDemoPlaying = true;
      const demoMelody = [
        { note: 'C4', freq: 261.63, dur: 220 },
        { note: 'E4', freq: 329.63, dur: 220 },
        { note: 'G4', freq: 392.00, dur: 220 },
        { note: 'C5', freq: 523.25, dur: 380 },
        { note: 'B4', freq: 493.88, dur: 220 },
        { note: 'G4', freq: 392.00, dur: 220 },
        { note: 'E4', freq: 329.63, dur: 220 },
        { note: 'C4', freq: 261.63, dur: 450 },
      ];
      let step = 0;
      demoTimerId = setInterval(() => {
        if (!isDemoPlaying || step >= demoMelody.length) {
          stopAllVoices();
          return;
        }
        const cur = demoMelody[step];
        playNote(cur.note, cur.freq);
        setTimeout(() => stopNote(cur.note), cur.dur - 30);
        step++;
      }, 260);
      $update();
    }

    function startOscilloscope() {
      if (animFrameId || typeof window === 'undefined') return;

      const draw = () => {
        animFrameId = window.requestAnimationFrame(draw);
        const canvas = document.getElementById('oscilloscope-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const w = canvas.width;
        const h = canvas.height;

        // Background
        ctx.fillStyle = '#090e17';
        ctx.fillRect(0, 0, w, h);

        // Center and grid lines
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
        ctx.beginPath();
        // Horizontals
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.moveTo(0, h / 4);
        ctx.lineTo(w, h / 4);
        ctx.moveTo(0, (3 * h) / 4);
        ctx.lineTo(w, (3 * h) / 4);
        // Verticals
        for (let x = 60; x < w; x += 60) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
        }
        ctx.stroke();

        // Waveform Render
        if (analyser) {
          const bufferLength = analyser.frequencyBinCount;
          const dataArray = new Uint8Array(bufferLength);
          analyser.getByteTimeDomainData(dataArray);

          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#00f0ff';
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 6;
          ctx.beginPath();

          const sliceWidth = w / bufferLength;
          let x = 0;
          for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = (v * h) / 2;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            x += sliceWidth;
          }
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      };

      draw();
    }

    // ----------------------------------------------------
    // 2. MIDI INSPECTOR STATE
    // ----------------------------------------------------
    let midiSupported = typeof navigator !== 'undefined' && 'requestMIDIAccess' in navigator;
    let midiStatus = midiSupported ? 'ready' : 'emulated';
    let midiAccess = null;
    let midiInputs = [];
    let midiOutputs = [];
    let midiLogs = [];
    let synthAudioEnabled = true;

    function getFormattedTimestamp() {
      const d = new Date();
      const pad = (n, len = 2) => String(n).padStart(len, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
    }

    function addMidiLog(type, text, hex, badgeColor = 'color-green') {
      midiLogs.unshift({
        time: getFormattedTimestamp(),
        type,
        text,
        hex,
        badgeColor,
      });
      if (midiLogs.length > 80) midiLogs.pop();
      $update();
    }

    function noteNumberToName(num) {
      const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const octave = Math.floor(num / 12) - 1;
      return `${names[num % 12]}${octave}`;
    }

    function noteNameToFreq(noteName) {
      const all = [...whiteKeys, ...blackKeys];
      const match = all.find((k) => k.note === noteName);
      if (match) return match.freq;
      return 440;
    }

    function handleMidiMessage(event) {
      if (!event || !event.data) return;
      const data = event.data;
      const status = data[0];
      const cmd = status >> 4;
      const ch = (status & 0x0f) + 1;
      const d1 = data[1];
      const d2 = data[2] || 0;

      const hexStr = `0x${status.toString(16).toUpperCase()} 0x${d1.toString(16).toUpperCase()} 0x${d2.toString(16).toUpperCase()}`;

      if (cmd === 9 && d2 > 0) {
        // Note On
        const noteName = noteNumberToName(d1);
        addMidiLog('NOTE ON', `Ch ${ch} | ${noteName} (${d1}) | Vel ${d2}`, hexStr, 'color-green');
        if (synthAudioEnabled) {
          playNote(noteName, 440 * Math.pow(2, (d1 - 69) / 12));
        }
      } else if (cmd === 8 || (cmd === 9 && d2 === 0)) {
        // Note Off
        const noteName = noteNumberToName(d1);
        addMidiLog('NOTE OFF', `Ch ${ch} | ${noteName} (${d1}) | Vel ${d2}`, hexStr, 'color-red');
        if (synthAudioEnabled) {
          stopNote(noteName);
        }
      } else if (cmd === 11) {
        // Control Change
        addMidiLog('CC', `Ch ${ch} | Controller #${d1} | Val ${d2}`, hexStr, 'color-orange');
      } else if (cmd === 14) {
        // Pitch Bend
        const bend = (d2 << 7) | d1;
        addMidiLog('PITCH', `Ch ${ch} | Pitch Bend: ${bend}`, hexStr, 'color-purple');
      } else {
        addMidiLog('SYS', `Ch ${ch} | Status: 0x${status.toString(16)}`, hexStr, 'color-blue');
      }
    }

    function updateMidiDevices() {
      if (!midiAccess) return;
      const inputs = [];
      const outputs = [];

      for (const input of midiAccess.inputs.values()) {
        inputs.push({
          id: input.id,
          name: input.name,
          manufacturer: input.manufacturer,
          state: input.state,
        });
        input.onmidimessage = handleMidiMessage;
      }

      for (const output of midiAccess.outputs.values()) {
        outputs.push({
          id: output.id,
          name: output.name,
          manufacturer: output.manufacturer,
          state: output.state,
        });
      }

      midiInputs = inputs;
      midiOutputs = outputs;
      $update();
    }

    async function rescanMidi() {
      if (typeof navigator === 'undefined' || !navigator.requestMIDIAccess) {
        midiSupported = false;
        midiStatus = 'emulated';
        addMidiLog('SYS', 'Probed Web MIDI: API unsupported in this environment. Virtual test mode active.', '0x00', 'color-orange');
        $update();
        return;
      }

      try {
        midiAccess = await navigator.requestMIDIAccess({ sysex: false });
        midiSupported = true;
        midiStatus = 'ready';
        updateMidiDevices();
        midiAccess.onstatechange = () => updateMidiDevices();
        addMidiLog('SYS', `Web MIDI connected. Detected ${midiInputs.length} in, ${midiOutputs.length} out.`, '0x00', 'color-blue');
      } catch (err) {
        midiStatus = 'denied';
        addMidiLog('SYS', `Web MIDI permission rejected: ${err.message}`, '0x00', 'color-red');
      }
      $update();
    }

    function triggerTestNote(noteName, noteNumber, velocity = 100) {
      const hex = `0x90 0x${noteNumber.toString(16).toUpperCase()} 0x${velocity.toString(16).toUpperCase()}`;
      addMidiLog('NOTE ON', `Ch 1 | ${noteName} (${noteNumber}) | Vel ${velocity}`, hex, 'color-green');

      // Send to physical MIDI outputs if connected
      if (midiAccess) {
        for (const out of midiAccess.outputs.values()) {
          try {
            out.send([0x90, noteNumber, velocity]);
          } catch (e) {}
        }
      }

      if (synthAudioEnabled) {
        playNote(noteName, noteNameToFreq(noteName));
      }

      setTimeout(() => {
        const offHex = `0x80 0x${noteNumber.toString(16).toUpperCase()} 0x00`;
        addMidiLog('NOTE OFF', `Ch 1 | ${noteName} (${noteNumber}) | Vel 0`, offHex, 'color-red');
        if (midiAccess) {
          for (const out of midiAccess.outputs.values()) {
            try {
              out.send([0x80, noteNumber, 0]);
            } catch (e) {}
          }
        }
        if (synthAudioEnabled) {
          stopNote(noteName);
        }
      }, 350);
    }

    function triggerTestChord() {
      triggerTestNote('C4', 60, 100);
      setTimeout(() => triggerTestNote('E4', 64, 100), 50);
      setTimeout(() => triggerTestNote('G4', 67, 100), 100);
    }

    function triggerTestCC(ccNum, val, name) {
      const hex = `0xB0 0x${ccNum.toString(16).toUpperCase()} 0x${val.toString(16).toUpperCase()}`;
      addMidiLog('CC', `Ch 1 | Controller #${ccNum} (${name}) | Val ${val}`, hex, 'color-orange');
      if (midiAccess) {
        for (const out of midiAccess.outputs.values()) {
          try {
            out.send([0xb0, ccNum, val]);
          } catch (e) {}
        }
      }
    }

    function toggleSynthMidiRouting() {
      synthAudioEnabled = !synthAudioEnabled;
      $update();
    }

    function clearMidiLogs() {
      midiLogs = [];
      $update();
    }

    // ----------------------------------------------------
    // 3. SERIAL TERMINAL STATE
    // ----------------------------------------------------
    const isWebSerialSupported = typeof navigator !== 'undefined' && 'serial' in navigator;
    let serialConnected = false;
    let isSimulatedDevice = true;
    let serialDeviceName = 'ESP32-S3 Module (Simulated)';
    let serialBaudRate = 115200;
    let serialLineEnding = 'CRLF';
    let serialInputText = '';
    let serialLogs = [
      { time: getFormattedTimestamp(), dir: 'sys', msg: 'Techno4 Hardware Serial Subsystem ready.' },
      { time: getFormattedTimestamp(), dir: 'sys', msg: 'Default baud rate configured at 115200 bps.' },
    ];
    let serialPort = null;
    let serialReader = null;

    const baudRates = [9600, 19200, 38400, 57600, 115200, 230400, 921600];

    function addSerialLog(dir, msg) {
      serialLogs.push({
        time: getFormattedTimestamp(),
        dir,
        msg,
      });
      if (serialLogs.length > 120) serialLogs.shift();
      $update();

      setTimeout(() => {
        const box = document.getElementById('serial-terminal-scroll-box');
        if (box) box.scrollTop = box.scrollHeight;
      }, 10);
    }

    function handleBaudChange(e) {
      serialBaudRate = parseInt(e.target.value, 10) || 115200;
      addSerialLog('sys', `Baud rate changed to ${serialBaudRate} bps`);
      $update();
    }

    function handleLineEndingChange(e) {
      serialLineEnding = e.target.value;
      $update();
    }

    function handleSerialInput(e) {
      serialInputText = e.target.value;
    }

    function handleSerialKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendSerialCommand();
      }
    }

    async function connectSerial() {
      if (isWebSerialSupported && !isSimulatedDevice) {
        try {
          serialPort = await navigator.serial.requestPort();
          await serialPort.open({ baudRate: serialBaudRate });
          serialConnected = true;
          serialDeviceName = 'WebSerial Physical Port';
          addSerialLog('sys', `Serial port opened at ${serialBaudRate} bps.`);
          readSerialStream();
        } catch (err) {
          addSerialLog('sys', `WebSerial connection failed: ${err.message}. Falling back to simulated driver.`);
          isSimulatedDevice = true;
          serialConnected = true;
          serialDeviceName = 'ESP32-S3 IoT Module (Simulated)';
        }
      } else {
        // Simulated / Total.js Serial Mode
        serialConnected = true;
        isSimulatedDevice = true;
        serialDeviceName = 'ESP32-S3 IoT Module (Simulated)';
        addSerialLog('sys', `Connected to ${serialDeviceName} at ${serialBaudRate} baud.`);
        addSerialLog('rx', 'rst:0x1 (POWERON_RESET),boot:0x13 (SPI_FAST_FLASH_BOOT)');
        addSerialLog('rx', 'Techno4 Firmware v2.0.0 (XTENSA-ESP32-S3) ready.');
      }
      $update();
    }

    async function disconnectSerial() {
      if (serialReader) {
        try {
          await serialReader.cancel();
          serialReader.releaseLock();
        } catch (e) {}
        serialReader = null;
      }
      if (serialPort) {
        try {
          await serialPort.close();
        } catch (e) {}
        serialPort = null;
      }
      serialConnected = false;
      addSerialLog('sys', `Serial port disconnected.`);
      $update();
    }

    function toggleSimulationMode() {
      isSimulatedDevice = !isSimulatedDevice;
      if (isSimulatedDevice) {
        serialDeviceName = 'ESP32-S3 IoT Module (Simulated)';
      } else {
        serialDeviceName = 'Physical WebSerial Port';
      }
      addSerialLog('sys', `Switched mode to: ${serialDeviceName}`);
      $update();
    }

    async function readSerialStream() {
      if (!serialPort || !serialPort.readable) return;
      try {
        const textDecoder = new TextDecoderStream();
        const readableStreamClosed = serialPort.readable.pipeTo(textDecoder.writable);
        serialReader = textDecoder.readable.getReader();

        while (true) {
          const { value, done } = await serialReader.read();
          if (done) break;
          if (value) {
            addSerialLog('rx', value.trim());
          }
        }
      } catch (err) {
        console.error('Serial read error:', err);
      }
    }

    function sendSerialCommand() {
      const text = (serialInputText || '').trim();
      if (!text) return;

      addSerialLog('tx', text);
      serialInputText = '';
      const inputEl = document.querySelector('.custom-terminal-input');
      if (inputEl) inputEl.value = '';

      // Physical WebSerial Write
      if (serialConnected && serialPort && serialPort.writable && !isSimulatedDevice) {
        try {
          const textEncoder = new TextEncoderStream();
          const writableStreamClosed = textEncoder.readable.pipeTo(serialPort.writable);
          const writer = textEncoder.writable.getWriter();
          let lineEnd = '\r\n';
          if (serialLineEnding === 'LF') lineEnd = '\n';
          else if (serialLineEnding === 'CR') lineEnd = '\r';
          else if (serialLineEnding === 'NONE') lineEnd = '';

          writer.write(text + lineEnd);
          writer.releaseLock();
        } catch (e) {
          addSerialLog('sys', `TX Error: ${e.message}`);
        }
      }

      // Simulated Hardware Responses
      if (isSimulatedDevice) {
        setTimeout(() => {
          const upper = text.toUpperCase();
          if (upper === 'AT') {
            addSerialLog('rx', 'OK');
          } else if (upper === 'AT+GMR') {
            addSerialLog('rx', 'AT version:2.4.0.0-techno4(s-4c6eb9e)\nSDK version:v4.4.4\ncompile time:Sep 10 2026\nOK');
          } else if (upper === 'STATUS') {
            addSerialLog('rx', '[SYS] Uptime: 4812s | Free Heap: 294816 B | Core: 240MHz | WiFi: CONNECTED (-54dBm)');
          } else if (upper === 'PING') {
            addSerialLog('rx', 'PONG (RTT=1.8ms)');
          } else if (upper === 'SENSORS') {
            addSerialLog('rx', '[ADC] Temp: 23.8°C | Humidity: 46.5% | Bus Voltage: 3.32V | Current: 74mA');
          } else if (upper === 'LED:ON') {
            addSerialLog('rx', '[GPIO] Pin 2 state set to HIGH (LED ON).');
          } else if (upper === 'LED:OFF') {
            addSerialLog('rx', '[GPIO] Pin 2 state set to LOW (LED OFF).');
          } else if (upper === 'HELP') {
            addSerialLog('rx', 'Supported commands: AT, AT+GMR, STATUS, PING, SENSORS, LED:ON, LED:OFF, CLEAR');
          } else if (upper === 'CLEAR') {
            clearSerialLogs();
          } else {
            addSerialLog('rx', `ECHO: ${text} [ERR: Unknown command]`);
          }
        }, 120);
      }
    }

    function sendQuickCommand(cmd) {
      serialInputText = cmd;
      sendSerialCommand();
    }

    function clearSerialLogs() {
      serialLogs = [];
      addSerialLog('sys', 'Terminal console cleared.');
    }

    // ----------------------------------------------------
    // TAB SWITCHING & LIFECYCLE HOOKS
    // ----------------------------------------------------
    function setTab(tab) {
      activeTab = tab;
      $update();
      if (tab === 'synth') {
        setTimeout(() => startOscilloscope(), 50);
      }
    }

    function onKeyDown(e) {
      if (activeTab !== 'synth') return;
      if (e.repeat) return;
      if (keyCharMap[e.code]) {
        const item = keyCharMap[e.code];
        playNote(item.note, item.freq);
      }
    }

    function onKeyUp(e) {
      if (activeTab !== 'synth') return;
      if (keyCharMap[e.code]) {
        const item = keyCharMap[e.code];
        stopNote(item.note);
      }
    }

    $on('pageInit', () => {
      if (typeof window !== 'undefined') {
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);
      }

      // Check Total.js Hardware Status
      if (typeof fetch !== 'undefined') {
        fetch('/api/hardware/serial')
          .then((res) => (res.ok ? res.json() : null))
          .then((data) => {
            if (data && data.available) {
              addSerialLog('sys', `Total.js Hardware Bridge detected: ${data.engine || 'Active'}`);
            }
          })
          .catch(() => {});
      }

      rescanMidi();
    });

    $on('pageBeforeRemove', () => {
      // 1. Cancel requestAnimationFrame
      if (animFrameId && typeof window !== 'undefined') {
        window.cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }

      // 2. Clear Demo Timer
      if (demoTimerId) {
        clearInterval(demoTimerId);
        demoTimerId = null;
      }

      // 3. Stop and disconnect all audio voices
      activeVoices.forEach((voice) => {
        try {
          voice.osc.stop();
          voice.osc.disconnect();
          voice.gain.disconnect();
        } catch (e) {}
      });
      activeVoices.clear();

      // 4. Close Web Audio context
      if (audioCtx && audioCtx.state !== 'closed') {
        try {
          audioCtx.close();
        } catch (e) {}
        audioCtx = null;
      }

      // 5. Close Serial streams & ports
      if (serialReader) {
        try {
          serialReader.cancel();
          serialReader.releaseLock();
        } catch (e) {}
        serialReader = null;
      }
      if (serialPort) {
        try {
          serialPort.close();
        } catch (e) {}
        serialPort = null;
      }

      // 6. Remove window event listeners
      if (typeof window !== 'undefined') {
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('keyup', onKeyUp);
      }
    });

    return $render;
  };
</script>
