      <!-- 4. Interactive Live Events Log -->
      <div class="block-title">Телеметрія подій (Live Values &amp; Snap)</div>
      <div class="block block-strong inset">
        <div class="display-flex justify-content-space-between align-items-center">
          <span>Останнє значення:</span>
          <b class="text-color-primary font-monospace">${lastEventText}</b>
        </div>
        <div class="display-flex justify-content-space-between align-items-center margin-top-half">
          <span>Стан прилипання (Snap):</span>
          <span class="badge ${snappedActive ? 'color-green' : 'color-gray'}">${snappedActive ? 'SNAP ACTIVE' : 'FREE'}</span>
        </div>
      </div>

</template>
<script>
export default (props, { $, $onMounted, $update }) => {
  let lastEventText = 'Рухайте або клікайте двічі по регулятору';
  let snappedActive = false;

  $onMounted(() => {
    $('.round-range-slider').on('roundrange:change change', (e) => {
      const target = e.target.f7RoundRange;
      if (target) {
        lastEventText = `${target.params.title || target.mode}: ${target.formatDisplayValue(target.value)}`;
        snappedActive = target.isSnapped;
        $update();
      }
    });

    $('.round-range-slider').on('roundrange:snap', (e) => {
      snappedActive = true;
      $update();
    });

    $('.round-range-slider').on('roundrange:reset', (e) => {
      const target = e.target.f7RoundRange;
      if (target) {
        lastEventText = `RESET -> ${target.params.title || target.mode}: ${target.defaultValue}`;
        snappedActive = target.isSnapped;
        $update();
      }
    });
  });

  return $render;
};
</script>
